name: Build Android app

# Builds the unsigned Android app (android/ folder) and saves it, with the
# build log, on the `apk-build` branch. Signing is done separately so the
# signing key never sits in this public repository.
on:
  push:
    branches: [android-app, main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        id: build
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
        continue-on-error: true
      - name: Save result to apk-build branch
        run: |
          mkdir /tmp/out
          cp /tmp/build.log /tmp/out/build.log
          cp android/app/build/outputs/apk/release/*.apk /tmp/out/ 2>/dev/null || true
          echo "${{ steps.build.outcome }} ${{ github.sha }}" > /tmp/out/STATUS
          # This branch only holds the APK: tell Vercel not to try to deploy it.
          echo '{"git":{"deploymentEnabled":false}}' > /tmp/out/vercel.json
          cd /tmp/out
          git init -q -b apk-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "APK build for ${{ github.sha }}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-build
